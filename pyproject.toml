[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "miniseek"
version = "0.1.0"
description = "Stage-0 Dense scaffold: ultra-small DeepSeek-V4.1-Flash-aligned LM (MiniMind-style)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wang Yifan" }]
dependencies = [
  "torch>=2.1.0",
  "transformers>=4.40.0",
  "huggingface_hub>=0.23.0",
  "numpy>=1.24.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
include = ["algo*", "api*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
